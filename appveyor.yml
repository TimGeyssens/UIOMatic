version: 1.0.{build}
image: Visual Studio 2022

environment:
  nodejs_version: "18.19.0"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

branches:
  only:
    - master
    - v7

init:
  - git config --global core.autocrlf true

install:
  - ps: Install-Product node $env:nodejs_version x64
  - node --version
  - npm --version
  - dotnet restore

before_build:
  - dotnet build --no-restore

build_script:
  - dotnet build src/UIOMatic.sln --configuration Release
  - dotnet pack src/UIOMatic.Core/UIOMatic.Core.csproj -o artifacts
  - dotnet pack src/UIOMatic.Front.API/UIOMatic.Front.API.csproj -o artifacts
  - dotnet pack src/UIOMatic.SPA/UIOMatic.SPA.csproj -o artifacts
  - dotnet pack src/UIOMatic.Front.Umbraco/UIOMatic.Front.Umbraco.csproj -o artifacts
  - dotnet pack src/UIOMatic/UIOMatic.csproj -o artifacts

test_script:
  - dotnet test src/UIOMatic.Tests/UIOMatic.Tests.csproj --no-build

artifacts:
  - path: artifacts/*.nupkg
    name: NuGet Packages

deploy:
  provider: NuGet
  api_key:
    secure: YOUR_NUGET_API_KEY
  on:
    branch: master
    appveyor_repo_tag: true 