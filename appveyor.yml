# version format
version: 7.0.0.{build}

# environment
environment:
  packageversion: 7.0.0
  nodejs_version: "18.17.0"

image: Visual Studio 2022

# Do not build on tags
skip_tags: true

# Install Node.js
install:
  - ps: Install-Product node $env:nodejs_version

assembly_info:
  patch: true
  file: '**\AssemblyInfo.*'
  assembly_version: '$(packageversion)'
  assembly_file_version: '$(packageversion)'

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '$(packageversion)'
  package_version: '$(packageversion)'

before_build:
  - appveyor-retry dotnet restore src/UIOMatic.sln -v Minimal

build_script:
  # Build .NET projects
  - dotnet build src/UIOMatic.sln
  - dotnet pack src/UIOMatic/UIOMatic.csproj -o artifacts
  - dotnet pack src/UIOMatic.Core/UIOMatic.Core.csproj -o artifacts
  - dotnet pack src/UIOMatic.Front.API/UIOMatic.Front.API.csproj -o artifacts
  - dotnet pack src/UIOMatic.Front.Umbraco/UIOMatic.Front.Umbraco.csproj -o artifacts
  
  # Build SPA
  - cd src/UIOMatic.SPA
  - npm install
  - npm run build
  - cd ../..
  
  # Create SPA NuGet package
  - nuget pack build/UIOMatic.SPA.nuspec -OutputDirectory artifacts
  
artifacts:
  - path: artifacts\*.nupkg

deploy:
  provider: NuGet
  server:
  api_key:
    secure: oK4E7nnsqROELHTg1p+1+DZjDZ8TK6zq6mMiOOEOFbkwcxBkjZPjMZAn7NbFnRVj
  artifact: /.*\.nupkg/
