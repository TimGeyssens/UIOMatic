# version format
version: 7.0.0.{build}

# environment
environment:
  nodejs_version: "18.19.0"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

image: Visual Studio 2022

# Do not build on tags
skip_tags: true

# Install Node.js
install:
  - ps: |
      $nodeVersion = $env:nodejs_version
      $nodeUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-x64.msi"
      $nodeInstaller = "node-installer.msi"
      Invoke-WebRequest -Uri $nodeUrl -OutFile $nodeInstaller
      Start-Process -FilePath msiexec.exe -ArgumentList "/i $nodeInstaller /quiet /norestart" -Wait
  - node --version
  - npm --version
  - appveyor-retry dotnet restore src/UIOMatic.sln -v Minimal

assembly_info:
  patch: true
  file: '**\AssemblyInfo.*'
  assembly_version: '$(packageversion)'
  assembly_file_version: '$(packageversion)'

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '$(packageversion)'
  package_version: '$(packageversion)'

before_build:
  - cd src
  - dotnet build --no-restore
  - cd ..

build_script:
  - cd src
  - dotnet build UIOMatic.sln --configuration Release
  - dotnet pack UIOMatic.Core/UIOMatic.Core.csproj -o ../artifacts
  - dotnet pack UIOMatic.Front.API/UIOMatic.Front.API.csproj -o ../artifacts
  - dotnet pack UIOMatic.SPA/UIOMatic.SPA.csproj -o ../artifacts
  - dotnet pack UIOMatic.Front.Umbraco/UIOMatic.Front.Umbraco.csproj -o ../artifacts
  - dotnet pack UIOMatic/UIOMatic.csproj -o ../artifacts
  - cd ..

test_script:
  - cd src
  - dotnet test UIOMatic.Tests/UIOMatic.Tests.csproj --no-build
  - cd ..

artifacts:
  - path: artifacts/*.nupkg
    name: NuGet Packages

deploy:
  provider: NuGet
  api_key:
    secure: YOUR_NUGET_API_KEY
  on:
    branch: master
    appveyor_repo_tag: true
